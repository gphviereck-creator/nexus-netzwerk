<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>N.E.X.U.S. – Internes Netzwerk</title>

    <link rel="stylesheet" href="style-login.css">

</head>


<body>

    <div class="login-box">

        <h1>N.E.X.U.S.</h1>

        <p>Internes Netzwerk - Login</p>


        <label for="teamname">
            Teamname
        </label>

        <input
            type="text"
            id="teamname"
            autocomplete="off"
        >


        <label for="passwort">
            Passwort
        </label>

        <input
            type="password"
            id="passwort"
        >


        <button id="login-button" type="button">
            Anmelden
        </button>


        <p id="login-fehler">
            Zugangsdaten ungültig.
        </p>

    </div>


    <script src="script-login.js"></script>

</body>

</html>
